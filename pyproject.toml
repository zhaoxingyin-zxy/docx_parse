[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-parse"
version = "0.1.0"
description = "Standalone DOCX parser extracted from MinerU"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.13.5,<5",
    "loguru>=0.7.2",
    "lxml>=4.0.0,<7.0.0",
    "openpyxl>=3.1.5,<4",
    "packaging>=23",
    "pandas>=2.3.3,<3",
    "pillow>=11.0.0",
    "pydantic>=2,<3",
    "pylatexenc>=2.10,<3",
    "python-docx>=1.2.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["docx_parse*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
